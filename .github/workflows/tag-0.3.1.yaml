name: Create 0.3.1 tag
on:
  push:
    branches: [main]
    paths: [".github/workflows/tag-0.3.1.yaml"]
permissions:
  contents: write
jobs:
  tag:
    runs-on: ubuntu-latest
    steps:
      - name: Create tag for validated release commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api --method POST "repos/${GITHUB_REPOSITORY}/git/refs" -f ref="refs/tags/0.3.1" -f sha="655eef2f9a7dc127821e35600ffae2b02aaa3ad9"
