name: Publish 0.3.1 release
on:
  push:
    branches: [main]
    paths: [".github/workflows/publish-0.3.1.yaml"]
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Publish existing version tag
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create 0.3.1 --repo "$GITHUB_REPOSITORY" --verify-tag --latest --title "KinderClose 0.3.1" --notes-file - <<'NOTES'
          ## Cambios
          - Corrige los requisitos del manifiesto para pasar la validación de Home Assistant.
          - Refuerza la gestión de sesión y limita las redirecciones para proteger las credenciales.
          - Actualiza los mínimos de dependencias del script y las acciones de integración continua.
          - Incorpora endurecimiento para la ejecución en Docker y pruebas adicionales.

          Tras actualizar la integración mediante HACS, reinicia Home Assistant para cargar la nueva versión.
          NOTES
