name: Validate
on:
  push:
  pull_request:
  workflow_dispatch:

# Mínimo privilegio: el GITHUB_TOKEN solo puede leer el repositorio.
permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      # Actions fijadas por SHA de commit (inmutable); Dependabot las actualiza.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.13'
      - run: pip install -r requirements.txt
      - run: python -m unittest discover -s tests -v
  hassfest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Home Assistant solo publica hassfest en la rama master: se fija el commit
      # revisado en lugar de seguir la rama. Actualizar manualmente de vez en cuando.
      - uses: home-assistant/actions/hassfest@86d4564712fa02543c808e3a693dd04f9d3f8361 # master 2026-10-26
