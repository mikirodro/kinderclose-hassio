name: Publish 0.3.3 release
on:
  push:
    branches: [main]
    paths: [".github/workflows/publish-0.3.3.yaml"]
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Publish validated integration version
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create 0.3.3 --repo "$GITHUB_REPOSITORY" --target 64b69cc49d10b98fba4d478efd69d9c9f51c691f --latest --title "KinderClose 0.3.3" --notes-file - <<'NOTES'
          ## Cambios
          - Actualiza la referencia fijada de la acción hassfest utilizada para validar la integración.
          - La implementación de hassfest no cambia entre las referencias revisadas.
          - Actualiza la versión de la integración a 0.3.3. No cambia el funcionamiento de los sensores.

          Las pruebas unitarias y hassfest han pasado. Tras actualizar mediante HACS, reinicia Home Assistant.
          NOTES
