version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    # Esperar unos días reduce el riesgo de adoptar una versión comprometida recién publicada.
    cooldown:
      default-days: 7
    groups:
      actions:
        patterns: ["*"]
  - package-ecosystem: pip
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      test-tooling:
        patterns: ["pytest-homeassistant-custom-component", "ruff"]
