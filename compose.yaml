services:
  kinderclose:
    build: .
    env_file: .env
    restart: unless-stopped
    # Endurecimiento: sistema de ficheros de solo lectura, sin capacidades
    # de Linux ni escalada de privilegios, y límites de recursos.
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    pids_limit: 64
    mem_limit: 256m
    logging:
      driver: json-file
      options:
        max-size: 5m
        max-file: "3"
