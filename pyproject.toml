# Configuración de herramientas de desarrollo. La integración se distribuye desde
# custom_components/; este archivo no se instala en Home Assistant.

[tool.pytest.ini_options]
testpaths = ["tests/ha"]
pythonpath = ["."]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.ruff]
target-version = "py313"
line-length = 200

[tool.ruff.lint]
# Errores, bugbear y reglas de seguridad (bandit).
select = ["E4", "E7", "E9", "F", "B", "S"]

[tool.ruff.lint.per-file-ignores]
# Las pruebas usan assert y credenciales ficticias.
"tests/**" = ["S101", "S105", "S106"]
